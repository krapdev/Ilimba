<canvas id="c" tabindex="0" aria-label="Ilimba : touchez l'écran pour faire sauter les Ilimbas"></canvas>
<div id="safe"></div>
<script>
(()=>{
'use strict';

/* =========================================================
   ILIMBA — prototype de jeu (un seul fichier)
   Tap / clic / Espace : saut  •  maintenir : saut plus haut
   Tap en l'air : double saut  •  M : son  •  P : pause
   ========================================================= */

/* ---------- Polices (chargées si réseau, sinon repli système) ---------- */
const VERSION='0.27.2';
const FD='"MochiyEmb","Mochiy Pop One","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif';
const FU='"ZenEmb","Zen Maru Gothic",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif';
try{ for(const f of ['40px MochiyEmb','700 20px ZenEmb','900 20px ZenEmb']) document.fonts.load(f,'Aあ'); }catch(e){}

/* ---------- Canvas & dimensions ---------- */
const cvs=document.getElementById('c');
let ctx=cvs.getContext('2d',{alpha:false}); const MAINCTX=ctx;
// compatibilité anciens navigateurs (Safari < 16, etc.) : roundRect
(function(){ function rr(x,y,w,h,r){ if(typeof r==='object'&&r) r=r[0]||r.x||0; r=Math.max(0,Math.min(+r||0,Math.abs(w)/2,Math.abs(h)/2));
    this.moveTo(x+r,y); this.lineTo(x+w-r,y); this.arcTo(x+w,y,x+w,y+r,r); this.lineTo(x+w,y+h-r); this.arcTo(x+w,y+h,x+w-r,y+h,r); this.lineTo(x+r,y+h); this.arcTo(x,y+h,x,y+h-r,r); this.lineTo(x,y+r); this.arcTo(x,y,x+r,y,r); this.closePath(); }
  try{ if(!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect=rr; }catch(e){}
  try{ if(window.Path2D&&!Path2D.prototype.roundRect) Path2D.prototype.roundRect=rr; }catch(e){}
  try{ if(window.OffscreenCanvasRenderingContext2D&&!OffscreenCanvasRenderingContext2D.prototype.roundRect) OffscreenCanvasRenderingContext2D.prototype.roundRect=rr; }catch(e){}
})();
const safeEl=document.getElementById('safe');
let W=1,H=1,DPR=1,DPR_BASE=1,S=1,VW=1,VH=1,OY=0,LEAD=0.4;
const SAFE={t:0,r:0,b:0,l:0};

/* ---------- Constantes de jeu (unités monde : hauteur de référence 720) ---------- */
const STEP=1/120, WORLD_H=720, SPACING=30, MAXT=8;
const G_UP=2700, G_DOWN=3250, JUMP=930, AIRJUMP=840, CUTV=380, MAXFALL=1500;
const Y_MIN=300, Y_MAX=590, PX_PER_M=40;
const BRUME_GAP=520, SLIME_MUL=0.5;

/* ---------- Utilitaires ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=Math.random;
const R=(a,b)=>a+(b-a)*rnd();
const RI=(a,b)=>Math.floor(a+(b-a+1)*rnd());
const rr=(a,b)=>a+(b-a)*Math.random();
const diff0=x=>clamp(x/65000,0,1);
// ---- zones de difficulté (en mètres) ----
const ZONES=[
  {m0:0,   m1:200,  jp:'第一章', name:'La Lisière',          tip:'Saute de branche en branche'},
  {m0:200, m1:450,  jp:'第二章', name:'Le Sous-bois',        tip:'Ronces et slime !'},
  {m0:450, m1:750, jp:'第三章', name:'La Forêt des corbeaux',tip:'Corbeaux… puis moustiques'},
  {m0:750, m1:1100, jp:'第四章', name:'Le Nid de l’araignée', tip:'Gare aux toiles'},
  {m0:1100,m1:1500, jp:'第五章', name:'Le Cœur de la Brume',  tip:'Tout à la fois !'},
];
const NIGHT_M=1500;
function zoneAt(x){ const m=x/PX_PER_M; if(m>=NIGHT_M) return {i:5,u:((m-NIGHT_M)%400)/400,night:true};
  for(let i=0;i<ZONES.length;i++){ const z=ZONES[i]; if(m<z.m1) return {i,u:(m-z.m0)/(z.m1-z.m0),night:false}; } return {i:4,u:1,night:false}; }
function zoneRest(x){ const z=zoneAt(x); return z.i>0&&z.u<0.12; }
// intensité en dents de scie : monte dans la zone, redescend un peu au début de la suivante
function diff(x){ const z=zoneAt(x); if(z.night) return 1;
  const base=z.i*0.18, peak=base+0.24, u=z.u;
  const v=u<0.12?lerp(Math.max(0,base-0.06),base,u/0.12):base+(peak-base)*Math.pow((u-0.12)/0.88,1.3);
  return clamp(v,0,1); }
function speedAt(x){ const m=x/PX_PER_M; return 320+230*(1-Math.exp(-m/650))+(m>=NIGHT_M?40:0); }

function compact(a,keep){let j=0;for(let i=0;i<a.length;i++){const v=a[i];if(keep(v))a[j++]=v;}a.length=j;}
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}

/* ---------- Trame manga (points) ---------- */
const dotCache={};
function dotTile(color){
  if(dotCache[color]) return dotCache[color];
  const c=makeCanvas(32,32), g=c.getContext('2d');
  g.fillStyle=color; g.beginPath(); g.arc(8,8,4.6,0,7); g.moveTo(28.6,24); g.arc(24,24,4.6,0,7); g.fill();
  return dotCache[color]=c;
}
function makeTone(g,color,unit){
  const p=g.createPattern(dotTile(color),'repeat');
  try{ if(p && p.setTransform && window.DOMMatrix) p.setTransform(new DOMMatrix([unit/32,0,0,unit/32,0,0])); }catch(e){}
  return p;
}
const TONE={
  bark:makeTone(ctx,'rgba(28,12,4,0.6)',11),
  body:makeTone(ctx,'rgba(12,40,14,0.5)',8),
  brume:makeTone(ctx,'rgba(90,50,130,0.55)',14),
};

/* ---------- Sprites de lueur ---------- */
function glowSprite(inner,mid){
  const c=makeCanvas(64,64), g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,inner); gr.addColorStop(0.25,mid); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64); return c;
}
const GLOW=glowSprite('rgba(255,255,215,1)','rgba(214,255,120,0.55)');
const GLOW_RED=glowSprite('rgba(255,150,130,1)','rgba(255,40,40,0.5)');
const GLOW_AMBER=glowSprite('rgba(255,240,170,1)','rgba(255,180,40,0.45)');
const GLOW_TEAL=glowSprite('rgba(220,255,250,1)','rgba(90,230,210,0.45)');
const GLOW_WARM=glowSprite('rgba(255,238,200,0.95)','rgba(255,205,140,0.3)');

let LEAVES=[];
function buildLeaves(){
  const k=Math.min(2.5,S*DPR_BASE); LEAVES=[];
  // 0-2 verts classiques, 3 vert tendre printanier plus fourni, 4 avec une ou deux feuilles d'automne
  const pal=[['#4e8a3b','#76b356'],['#3f7a3c','#62a24c'],['#5d9440','#8cc35f'],['#7cb34a','#a8d46a'],['#4e8a3b','#76b356']];
  for(let v=0;v<5;v++){
    const c=makeCanvas(80*k,60*k), g=c.getContext('2d'); g.scale(k,k);
    const r=mulberry32(100+v), n=v===3?8:7+(v%3);

    for(let i=0;i<n;i++){
      const a=-Math.PI*0.95+Math.PI*0.9*(i/(n-1))+(r()-0.5)*0.3, len=18+r()*10;
      g.save(); g.translate(40+Math.cos(a)*len*0.55,46+Math.sin(a)*len*0.55); g.rotate(a);
      g.beginPath(); g.ellipse(0,0,len*0.62,len*0.25,0,0,7);
      g.fillStyle=v===4&&(i===2||i===n-2)?(i===2?'#f0a050':'#f29ab8'):pal[v][i%2]; g.fill(); g.lineWidth=1.4; g.strokeStyle='#1c3514'; g.stroke();
      g.beginPath(); g.moveTo(-len*0.5,0); g.lineTo(len*0.5,0); g.strokeStyle='rgba(20,50,15,0.5)'; g.lineWidth=1; g.stroke();
      g.restore();
    }
    LEAVES.push(c);
  }
}

/* ---------- Trame d'écran (vignette en points) ---------- */
const HALF=makeCanvas(1,1);
function buildHalftone(){
  HALF.width=Math.ceil(W); HALF.height=Math.ceil(H);
  const g=HALF.getContext('2d'); g.clearRect(0,0,W,H); g.fillStyle='#0b0d16';
  const sp=8, cx=W/2, cy=H/2;
  for(let y=0,row=0;y<H+sp;y+=sp,row++){
    for(let x=(row&1)*sp/2;x<W+sp;x+=sp){
      const d=Math.hypot((x-cx)/(W/2),(y-cy)/(H/2))/1.4142;
      let t=(d-0.5)/0.5; if(t<=0) continue; t=Math.min(1,t);
      g.beginPath(); g.arc(x,y,sp*0.52*t,0,7); g.fill();
    }
  }
}

/* =========================================================
   DÉCORS EN PARALLAXE (tuiles pré-rendues)
   ========================================================= */
function blobsOff(g,list,ox,ink,fill,iw){
  if(ink){ g.fillStyle=ink; g.beginPath(); for(const b of list){ g.moveTo(b[0]+ox+b[2]+iw,b[1]); g.arc(b[0]+ox,b[1],b[2]+iw,0,7); } g.fill(); }
  g.fillStyle=fill; g.beginPath(); for(const b of list){ g.moveTo(b[0]+ox+b[2],b[1]); g.arc(b[0]+ox,b[1],b[2],0,7); } g.fill();
}
function trunk(g,x,w,lean,top,bot,o){
  const rg=mulberry32(o.seed||7), Rr=(a,b)=>a+(b-a)*rg();
  const xl0=x-w*0.4+lean, xr0=x+w*0.4+lean, xl1=x-w*0.56, xr1=x+w*0.56, my=(top+bot)/2;
  const P=new Path2D();
  P.moveTo(xl0,top); P.bezierCurveTo(xl0-lean*0.3,my-200,xl1+lean*0.15,my+200,xl1,bot);
  P.lineTo(xr1,bot); P.bezierCurveTo(xr1+lean*0.15,my+200,xr0-lean*0.3,my-200,xr0,top); P.closePath();
  g.fillStyle=o.fill; g.fill(P);
  g.save(); g.clip(P);
  g.save(); g.translate(-w*0.5,0); g.fillStyle=o.tone; g.fill(P); g.restore();
  g.strokeStyle=o.bark; g.lineWidth=o.barkW||2;
  for(let k=0;k<o.lines;k++){
    const f=Rr(0.12,0.88), a0=lerp(xl0,xr0,f), a1=lerp(xl1,xr1,f);
    g.setLineDash([Rr(40,150),Rr(30,90)]); g.lineDashOffset=Rr(0,200);
    g.beginPath(); g.moveTo(a0,top); g.bezierCurveTo(a0-lean*0.3+Rr(-6,6),my-200,a1+lean*0.15+Rr(-6,6),my+200,a1,bot); g.stroke();
  }
  g.setLineDash([]); g.restore();
  const Rp=new Path2D(); Rp.moveTo(xr1-3,bot); Rp.bezierCurveTo(xr1+lean*0.15-3,my+200,xr0-lean*0.3-3,my-200,xr0-3,top);
  g.strokeStyle=o.rim; g.lineWidth=o.rimW||3; g.stroke(Rp);
  g.strokeStyle=o.ink; g.lineWidth=o.inkW||2.5; g.stroke(P);
}
const trunkX=(t,y)=>t.x+t.lean*(1-(y+650)/2550);
function bough(g,b,ox,o){
  const t=b.t, sx=trunkX(t,b.y)+ox+b.dir*t.w*0.3, sy=b.y;
  const dx=b.dir*Math.cos(b.ang), dy=Math.sin(b.ang);
  const ex=sx+dx*b.len, ey=sy+dy*b.len, nx=-dy, ny=dx;
  const mx=(sx+ex)/2, my=(sy+ey)/2-b.len*0.08;
  const h0=b.th/2, h1=2.5;
  const P=new Path2D();
  P.moveTo(sx+nx*h0,sy+ny*h0); P.quadraticCurveTo(mx+nx*(h0+h1)/2,my+ny*(h0+h1)/2,ex+nx*h1,ey+ny*h1);
  P.lineTo(ex-nx*h1,ey-ny*h1); P.quadraticCurveTo(mx-nx*(h0+h1)/2,my-ny*(h0+h1)/2,sx-nx*h0,sy-ny*h0); P.closePath();
  g.fillStyle=o.fill; g.fill(P); g.strokeStyle=o.ink; g.lineWidth=2.2; g.stroke(P);
  if(b.leaves) blobsOff(g,b.leaves.map(l=>[ex+l[0],ey+l[1],l[2]]),0,o.leafInk,o.leaf,2.5);
}

function drawClouds(g,L){
  const tw=L.tw, items=[];
  for(let i=0;i<8;i++){
    const cx=R(0,tw), cy=R(-430,240), w=R(170,400), h=w*R(0.2,0.32), n=RI(5,8), list=[];
    for(let k=0;k<n;k++){ const t=k/(n-1), r=h*R(0.5,0.85)*(1-Math.abs(t-0.5)*0.8); list.push([cx-w/2+w*t,cy-r*0.3+R(-5,5),r]); }
    items.push({cx,cy,w,h,list});
  }
  for(const ox of [-tw,0,tw]) for(const it of items){
    if(it.cx+ox+it.w<0||it.cx+ox-it.w>tw) continue;
    blobsOff(g,it.list,ox,'rgba(170,110,125,0.5)','#fbe2cd',2.2);
    g.save(); g.globalCompositeOperation='source-atop'; g.fillStyle='rgba(236,168,160,0.55)';
    g.fillRect(it.cx+ox-it.w,it.cy+it.h*0.08,it.w*2,it.h*1.4); g.restore();
  }
}
function drawMountains(g,L){
  const tw=L.tw, P2=Math.PI*2;
  const ridge=(base,amp,fr,col,col2)=>{
    const ph=[R(0,6),R(0,6),R(0,6)];
    g.beginPath(); g.moveTo(0,3000);
    for(let x=0;x<=tw;x+=16){ const u=x/tw*P2; g.lineTo(x,base-amp*(0.55*Math.sin(u*fr[0]+ph[0])+0.3*Math.sin(u*fr[1]+ph[1])+0.15*Math.sin(u*fr[2]+ph[2]))); }
    g.lineTo(tw,3000); g.closePath();
    const gr=g.createLinearGradient(0,base-amp,0,base+260); gr.addColorStop(0,col); gr.addColorStop(1,col2); g.fillStyle=gr; g.fill();
  };
  ridge(360,120,[2,5,13],'#9c94bf','#c4b2c8');
  ridge(455,80,[3,7,17],'#7d84ad','#b6b3c9');
  const mg=g.createLinearGradient(0,430,0,700); mg.addColorStop(0,'rgba(240,205,195,0)'); mg.addColorStop(1,'rgba(214,200,210,0.92)');
  g.fillStyle=mg; g.fillRect(-10,430,tw+20,270); g.fillStyle='rgba(214,200,210,0.92)'; g.fillRect(-10,700,tw+20,2400);
}
function drawFarForest(g,L){
  const tw=L.tw, P2=Math.PI*2, list=[], hi=[], ph=R(0,6);
  let x=0;
  while(x<tw){ const r=R(28,58), y=465+20*Math.sin(x/tw*P2*3+ph)+R(-12,12)-r*0.35; list.push([x,y,r]); if(rnd()<0.6) hi.push([x-r*0.25,y-r*0.3,r*0.5]); x+=r*R(0.75,1.15); }
  g.strokeStyle='#3d5b76'; g.lineWidth=4;
  for(const ox of [-tw,0,tw]){ g.beginPath(); for(const b of list){ g.moveTo(b[0]+ox,b[1]); g.lineTo(b[0]+ox,720); } g.stroke(); }
  for(const ox of [-tw,0,tw]) blobsOff(g,list,ox,'#3b5a77','#557a9b',2);
  g.globalAlpha=0.45; for(const ox of [-tw,0,tw]) blobsOff(g,hi,ox,null,'#7ea2bf',0); g.globalAlpha=1;
  const mg=g.createLinearGradient(0,470,0,690); mg.addColorStop(0,'rgba(165,182,205,0)'); mg.addColorStop(1,'rgba(150,172,196,0.95)');
  g.fillStyle=mg; g.fillRect(-10,470,tw+20,220); g.fillStyle='rgba(150,172,196,0.95)'; g.fillRect(-10,690,tw+20,1500);
}
function drawMidTrees(g,L){
  const tw=L.tw, tone=makeTone(g,'rgba(10,28,38,0.6)',13), n=7, trees=[], can=[], hi=[], moss=[], boughs=[];
  for(let i=0;i<n;i++){
    const t={x:(i+R(0.15,0.85))*tw/n,w:R(36,66),lean:R(-36,36),seed:RI(1,1e6)}; trees.push(t);
    for(let k=0;k<6;k++){ const b=[t.x+t.lean+R(-150,150),R(-620,-170),R(70,130)]; can.push(b); if(rnd()<0.7) hi.push([b[0]-b[2]*0.3,b[1]-b[2]*0.3,b[2]*0.45]); }
    for(let k=0;k<5;k++) moss.push({x:t.x+t.lean*0.8+R(-120,120),y0:R(-240,-140),len:R(70,230),w:R(1.5,3.5),c:R(-10,10)});
    const nb=RI(1,2);
    for(let k=0;k<nb;k++){ const lv=[]; for(let j=0;j<RI(3,4);j++) lv.push([R(-30,30),R(-26,10),R(18,32)]);
      boughs.push({t,y:R(-260,170),dir:rnd()<0.5?-1:1,len:R(90,190),ang:R(-0.55,-0.12),th:R(10,16),leaves:lv}); }
  }
  const OX=[-tw,0,tw];
  for(const ox of OX) blobsOff(g,can,ox,'#16303d','#284a5b',3);
  g.globalAlpha=0.55; for(const ox of OX) blobsOff(g,hi,ox,null,'#3d6577',0); g.globalAlpha=1;
  for(const ox of OX) for(const t of trees){ if(t.x+ox<-160||t.x+ox>tw+160) continue;
    trunk(g,t.x+ox,t.w,t.lean,-650,1900,{fill:'#2b4e60',tone,bark:'#1f3e4f',rim:'rgba(140,186,192,0.7)',ink:'#15303c',lines:4,seed:t.seed}); }
  for(const ox of OX) for(const b of boughs) bough(g,b,ox,{fill:'#2b4e60',ink:'#15303c',leaf:'#264a5b',leafInk:'#132a35'});
  g.lineCap='round';
  for(const ox of OX) for(const m of moss){ g.strokeStyle='rgba(118,165,128,0.55)'; g.lineWidth=m.w; g.beginPath(); g.moveTo(m.x+ox,m.y0); g.quadraticCurveTo(m.x+ox+m.c,m.y0+m.len*0.5,m.x+ox,m.y0+m.len); g.stroke(); }
  const mg=g.createLinearGradient(0,560,0,800); mg.addColorStop(0,'rgba(120,150,170,0)'); mg.addColorStop(1,'rgba(110,140,160,0.78)');
  g.fillStyle=mg; g.fillRect(-10,560,tw+20,240); g.fillStyle='rgba(110,140,160,0.78)'; g.fillRect(-10,800,tw+20,1300);
}
/* ---------- Petits animaux sur les troncs (même parallaxe que les grands troncs) ---------- */
let NEAR=null, critters=null;
function initCritters(){
  if(critters||!NEAR) return;
  critters=[];
  // un seul écureuil par tuile de décor (sur le tronc du milieu)
  [NEAR.trees[1]||NEAR.trees[0]].forEach((t,i)=>{
    const n=1;
    for(let k=0;k<n;k++) critters.push({type:'squirrel',t,side:rr(0,1)<0.5?-1:1,y:rr(-60,520),dir:-1,st:'pause',timer:rr(0.5,3),ph:rr(0,6),sp:rr(110,170),s:rr(1.05,1.3),look:0});
  });
  for(const k of NEAR.knots) critters.push({type:'owl',k,st:'hidden',timer:rr(1,5),up:0,ph:rr(0,6),blink:rr(1,4)});
}
function updateCritters(dt){
  if(!critters) return;
  const yTop=Math.max(-220,-OY+60), yBot=Math.min(620,VH-OY-90);
  for(const c of critters){
    c.ph+=dt; c.timer-=dt;
    if(c.type==='squirrel'){
      if(c.st==='climb'){
        c.y+=c.dir*c.sp*dt;
        if(c.y<yTop){ c.y=yTop; c.dir=1; }
        if(c.y>yBot){ c.y=yBot; c.dir=-1; }
        if(c.timer<=0){ c.st=Math.random()<0.35?'look':'pause'; c.timer=rr(0.6,2.2); }
      } else {
        c.look+=((c.st==='look'?1:0)-c.look)*Math.min(1,dt*8);
        if(c.timer<=0){
          if(Math.random()<0.15){ c.side=-c.side; } // passe de l'autre côté du tronc
          c.st='climb'; c.timer=rr(0.6,1.8); c.dir=Math.random()<0.5?-1:1; c.sp=rr(110,190);
        }
      }
    } else {
      c.blink-=dt; if(c.blink<-0.15) c.blink=rr(1.5,4);
      if(c.st==='hidden'){ c.up=Math.max(0,c.up-dt*3); if(c.timer<=0){ c.st='peek'; c.timer=rr(2.5,6); } }
      else { c.up=Math.min(1,c.up+dt*2.5); if(c.timer<=0){ c.st='hidden'; c.timer=rr(2,6); } }
    }
  }
}
function drawSquirrel(c,x,y){
  const up=c.dir<0, climbing=c.st==='climb', t=c.ph, s=c.s;
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.rotate(up?-Math.PI/2:Math.PI/2);
  if((up&&c.side>0)||(!up&&c.side<0)) ctx.scale(1,-1);
  if(c.look>0.01) ctx.rotate(-c.look*0.5); // regarde vers l'extérieur
  ctx.lineJoin='round'; ctx.lineCap='round';
  const leg=climbing?Math.sin(t*22):0;
  // queue touffue

function doJump(air){
  const P=pilot;
  P.vy=-(air?AIRJUMP:JUMP); P.g=false; P.plat=null; P.coyote=0; P.buf=0;

function pilotPress(){
  const P=pilot; P.hold=true;
  if(P.fell) return;
  if(P.stuck){ stuckTap(); return; }
  if(P.g||P.coyote>0){ doJump(false); return; }
  if(P.air>0){
    if(P.vy>0){ const b=branchAt(game.X); if(b){ const d=surf(b,game.X)-P.y; if(d>=0&&d<34){ P.buf=0.13; return; } } }

function sampleTrail(x){
  const tr=trail, n=tr.length;
  if(x<=tr[0].x) return tr[0];
  if(x>=tr[n-1].x) return tr[n-1];
  let lo=0,hi=n-1;
  while(hi-lo>1){ const mid=(lo+hi)>>1; if(tr[mid].x<=x) lo=mid; else hi=mid; }
  const a=tr[lo], b=tr[hi], t=(x-a.x)/((b.x-a.x)||1);
  return {y:a.y+(b.y-a.y)*t, vy:a.vy+(b.vy-a.vy)*t, g:a.g&&b.g, sl:a.sl&&b.sl};
}
function scanEvents(px,nx,m,i){
  let lo=0,hi=trail.length-1;
  while(lo<hi){ const mid=(lo+hi)>>1; if(trail[mid].x<=px) lo=mid+1; else hi=mid; }
  for(let k=lo;k<trail.length&&trail[k].x<=nx;k++){
    const f=trail[k].f; if(!f) continue;
    if(f===1){ m.st=1; m.sq=0; if(i>0) SFX.hop(m.pitch); }
    else if(f===2){ m.spin=1; m.st=0.7; if(i>0) SFX.hop(m.pitch*1.3); }
    else if(f===3){ m.sq=1; dust(trail[k].x,trail[k].y,3); }
  }
}

  lost.push({m,x:m.x,y:m.y-m.r,vx:cause==='brume'?-60:rr(-60,40),vy:cause==='brume'?-120:-560,t:0,rot:0,vr:rr(-9,9),cause});

    game.danger=Math.min(0.97,game.danger+0.15); game.shake=Math.max(game.shake,11); game.flash=0.5; game.lines=Math.max(game.lines,0.8);

  const WR=game.windRush||(game.windRush=[]), wv=game.windVis;
  if(on||wr>0.3){
    const want=Math.round(10+40*wr); let n=0;
    while(WR.filter(o=>!o.leaf).length<want&&n++<4){ const near=Math.random()<0.7, g=(Math.random()+Math.random()+Math.random()-1.5)*2;
      WR.push({x:VW+rr(0,260), y:near?pilot.y-35+g*70:rr(OY>0?-OY:0,WORLD_H), len:rr(60,140)+rr(40,200)*wr*(near?1.15:0.8), v:rr(900,1300)+rr(700,1200)*wr, w:rr(1,3.4)*(near?1:0.7), a:rr(0.35,0.9)*(near?1:0.6), cur:Math.random()<0.25?rr(-1,1):0}); }
    if(Math.random()<dt*3.2) WR.push({leaf:true,x:VW+30,y:pilot.y-rr(10,170),v:rr(900,1400),vy:rr(-60,60),r:rr(0,6.28),vr:rr(6,12),c:Math.random()<0.5?'#8fcf7a':'#e0b35a',s:rr(0.8,1.4)});
  }

  if(WR.length) compact(WR,o=>o.x+(o.len||20)>-40);
}
function drawWindRush(){

function update(dt){
  if(state==='pause') return;
  game.time+=dt;
  if(state==='play'){
    if(!owns(8)&&game.X/PX_PER_M>=NIGHT_M) exploitUnlock(8,game.X+40,pilot.y-120);
    if(!owns(10)&&pilot.g&&pilot.plat&&pilot.plat.route==='up'&&pilot.plat.forkN&&!game.upSeen.includes(pilot.plat.forkN)){ game.upSeen.push(pilot.plat.forkN); if(game.upSeen.length>=3) exploitUnlock(10,game.X+40,pilot.y-120); }
    acc+=dt; let n=0;
    while(acc>=STEP&&n<14){ prevX=game.X; physicsStep(STEP); acc-=STEP; n++; }
    if(n>=14) acc=0;
    renderX=prevX+(game.X-prevX)*(acc/STEP);
    const d=diff(game.X);
    { const z=zoneAt(game.X), key=z.night?'n'+Math.floor((game.X/PX_PER_M-NIGHT_M)/400):z.i; if(game.zoneKey!==key){ if(game.zoneKey!=null){ game.zoneT=3.2; game.zoneShow=z; SFX.zone&&SFX.zone(); setTimeout(()=>cheer(z.night?'おやすみ〜':'いいね !',true),2600); } game.zoneKey=key; } if(game.zoneT>0) game.zoneT-=dt; }
    if(!pilot.fell){
      // la Brume avance à sa propre vitesse : si la troupe ralentit, elle se rapproche
      game.danger=clamp(game.danger+dt*(game.speed*(1.025+0.03*d+(zoneAt(game.X).i>=3?0.012:0))-(pilot.stuck?game.speed*0.45:game.vxNow))/BRUME_GAP,0,1);
      if(!game.slimeHint) for(const b of branches) for(const s2 of b.slimes) if(s2.x>game.X&&s2.x-game.X<VW*0.5){ game.slimeHint=true; addText('SAUTE !',s2.x+s2.w/2,surf(b,s2.x)-80,{size:26,color:'#ffe94a',max:2,vy:-8,rot:-0.06}); }

      const Zc=zoneAt(game.X); let restNow=zoneRest(game.X);
      for(const F of game.forks){ if(game.X>F.x0-400&&game.X<F.x1){ restNow=true;
        if(F.crow&&!F.done.c&&game.X>F.x0-60){ F.done.c=1; if(Math.abs(pilot.y-F.upY)<150||pilot.y<F.upY+60) spawnCrow(F.upY); }
        if(F.mosq&&!F.done.m&&game.X>F.x0+250){ F.done.m=1; if(pilot.y>F.upY+120) spawnMosq(F.lowY); } } }
      if(game.forks.length>4) game.forks.splice(0,game.forks.length-4);
      if(Zc.i>=2&&!restNow) game.nextCrow-=dt;
      if(game.nextCrow<=0){ spawnCrow(); if(d>0.5&&rnd()<0.3) setTimeout(()=>{ if(state==='play') spawnCrow(); },600); game.nextCrow=R(lerp(5.5,2.2,d),lerp(8.5,4,d)); }
      if((Zc.i>=3||(Zc.i===2&&Zc.u>0.5))&&!restNow) game.nextMosq-=dt;
      if(game.nextMosq<=0){ if(game.nextCrow<2.2) game.nextMosq=2.5; else { spawnMosq(); game.nextMosq=R(lerp(11,6,d),lerp(16,9,d)); } }

    } else {
      game.fallT+=dt; const bottom=VH-OY+40;
      if(game.fallT>2.4||members.every(m=>m.y-m.r*2>bottom)) gameOver('fall');
    }
    if(brume.grab){ brume.grab.t+=dt; if(brume.grab.t>0.34){ brume.grab=null; loseMember(members.length-1,'brume'); game.danger=0.62; } }
    if(game.comboT>0) game.comboT-=dt;
    if(!pilot.fell&&game.danger>0.82&&game.danger<0.97&&!game.arm&&!game.portrait) cheer('がんばれ !');
    if(best>200&&!game.passedBest&&Math.floor(game.X/PX_PER_M)+game.lucs*3+game.bonus>best){ game.passedBest=true; cheer('すごい !',true); }
  } else renderX=game.X;
  camX=renderX-VW*LEAD;
  ensureBranches(500);
  updateMembers(dt);
  if(state==='play'&&!pilot.fell) collisions();
  updateArm(dt); updateWind(dt); rescueStep(dt);
  updateCritters(dt); updateLost(dt); updateCrows(dt); updateBrume(dt); updateParts(dt); updateTexts(dt); ambient(dt);
  const lim=camX-600;
  while(branches.length>2&&branches[0].x1<lim) branches.shift();
  if(lucioles.length>40||Math.random()<0.02) compact(lucioles,l=>!l.taken&&l.x>camX-120);
  game.shake*=Math.exp(-dt*9); if(game.shake<0.05) game.shake=0;
  game.flash*=Math.exp(-dt*6); game.lines=Math.max(0,game.lines-dt*1.4);
  if(state==='over') overT+=dt;
  updateSky(dt);
}
function updateMembers(dt){
  for(let i=0;i<members.length;i++){
    const m=members[i];
    m.off*=Math.exp(-dt*4.5); if(m.off<0.05) m.off=0;
    const nx=renderX-i*SPACING-m.off, px=(m.x===undefined)?nx:m.x;
    const s=sampleTrail(nx);
    if(state==='play'&&nx>px) scanEvents(px,nx,m,i);
    m.x=nx; m.y=s.y; m.vy=s.vy; m.g=s.g; m.sl=!!s.sl;
    if(m.g){ const bb=branchAt(nx,m.y); if(bb&&bb.sw) m.y=surf(bb,nx); } // suit la branche qui se balance
    if(m.g) m.step+=(nx-px)*(m.sl?0.05:0.085);
    if(m.sl&&state==='play'&&Math.random()<dt*6) goo(m.x,m.y,1);
    m.sq*=Math.exp(-dt*9); m.st*=Math.exp(-dt*7); if(m.spin>0) m.spin=Math.max(0,m.spin-dt*3.2);
    m.blink-=dt; if(m.blink<-0.13) m.blink=R(1.5,4.5);
    if(m.blend<1) m.blend=Math.min(1,m.blend+dt*1.7);
    if(state==='title'){ m.hop-=dt; if(m.hop<-0.45) m.hop=rr(0.8,3.8); }
    if(m.blend>=1&&Math.random()<dt*0.7) parts.push({type:'twinkle',x:m.x+rr(-m.r,m.r),y:m.y-m.r*rr(1.2,2.4),vx:rr(-10,10),vy:rr(-30,-10),life:0,max:rr(0.5,0.9),r:rr(3,5.5),c:m.pal[4]});
  }
}
function collisions(){
  const vx0=camX-50, vx1=camX+VW+50;
  for(const b of branches){
    if(!b.thorns.length||b.x1<vx0||b.x0>vx1) continue;
    for(const th of b.thorns){
      if(th.crushed) continue;
      // zone qui pique = dôme calé sur la forme dessinée (mesurée) de la ronce
      const HW=th.w*1.0, HM=th.h*1.22, hv=Math.sin(th.x*12.9898+9*78.233)*43758.5453, cx=th.x+((hv-Math.floor(hv))<0.5?-1:1)*th.w*0.12; // centre décalé vers la grande crosse
      for(let i=0;i<members.length;i++){
        const m=members[i]; if(m.blend<1) continue;
        const d=Math.max(0,Math.abs(m.x-cx)-m.r*0.6); if(d>=HW) continue;
        const gy=surf(b,m.x), top=gy-HM*(1-(d/HW)*(d/HW));
        if(m.y>top+5&&m.y<gy+14){ th.crushed=true; loseMember(i,'thorn'); break; }
      }
    }
  }
  for(const L of lanterns){
    if(L.taken||L.x<vx0||L.x>vx1) continue;
    const ly=L.y+Math.sin(game.time*2+L.ph)*6;
    for(const m of members){ if(m.blend<1) continue; const dx=m.x-L.x, dy=(m.y-m.r)-ly, rad=34+m.r*0.6; if(dx*dx+dy*dy<rad*rad){ takeLantern(L,ly); break; } }
  }
  for(const l of lucioles){
    if(l.taken||l.x<vx0||l.x>vx1) continue;
    const ly=l.y+Math.sin(game.time*3+l.ph)*4;
    for(const m of members){
      if(m.blend<1) continue;
      const dx=m.x-l.x, dy=(m.y-m.r)-ly, rad=20+m.r*0.6;
      if(dx*dx+dy*dy<rad*rad){ collect(l,ly); break; }
    }
  }
}
function brumeMouth(y){
  let best=null, bd=1e9;
  for(const f of FACE_FRONT){ const mx=brume.x+f[0]*brume.sc, my=brume.mouthY+(f[1]+23*f[2])*brume.sc, dd=Math.abs(my-y); if(dd<bd){ bd=dd; best=[mx,my]; } }
  return best||[brume.x-70,brume.mouthY];
}
function updateLost(dt){
  for(const L of lost){

// toile d'araignée dans l'angle branche/tronc : C = coin, uy(x) = dessous de la branche, dir = sens de la base (+1 base à droite).
// les bords de la toile suivent le dessous de la branche (fil du haut) et la paroi du tronc (fil latéral)
function dWeb(Cx,Cy,dir,t,uy,mode){
  const R=150, NS=9;
  const U=r=>{ const x=Cx-dir*r; return [x,uy(x)]; };
  const Wl=r=>[Cx,Cy+r];
  const P=(f,r)=>{ const u=U(r), w=Wl(r); return [Cx+(1-f)*(u[0]-Cx)+f*(w[0]-Cx), Cy+(1-f)*(u[1]-Cy)+f*(w[1]-Cy)]; };
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  // fils rayonnants
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=1.3;
  if(mode!==2) for(let i=0;i<NS;i++){ const f=i/(NS-1); ctx.beginPath(); ctx.moveTo(Cx,Cy); for(let k=1;k<=6;k++){ const q=P(f,R*k/6); ctx.lineTo(q[0],q[1]); } ctx.stroke(); }
  // spirales : s'accrochent aux deux bords, légèrement affaissées entre les rayons
  ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1;
  const rings=[14,32,54,80,112,R];
  if(mode!==2) for(const r of rings){
    ctx.beginPath(); let prev=P(0,r); ctx.moveTo(prev[0],prev[1]);
    for(let i=1;i<NS;i++){
      const q=P(i/(NS-1),r), mx=(prev[0]+q[0])/2, my=(prev[1]+q[1])/2;
      const wob=Math.sin(t*1.5+i+r*0.15)*0.8, sag=0.1+0.02*Math.sin(t*1.2+r);
      ctx.quadraticCurveTo(mx+(Cx-mx)*sag+wob,my+(Cy-my)*sag+wob,q[0],q[1]); prev=q;
    }
    ctx.stroke();
  }
  if(mode===1){ ctx.restore(); return; }
  // gouttes de rosée qui brillent
  for(let i=0;i<14;i++){
    const q=P(0.08+((i*0.37)%0.84),rings[1+i%5]);
    glow(GL.pink,q[0],q[1],6.5,0.4+0.35*Math.sin(t*3+i*1.7));
    ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.arc(q[0],q[1],1.6,0,7); ctx.fill();
  }
  const sp=P(0.5,80); ctx.fillStyle='#fff'; star4(sp[0],sp[1],3*(0.5+0.5*Math.sin(t*4)));
  // petite araignée kawaii suspendue à un fil
  const h=P(0.4,54), dl=9+Math.sin(t*1.1)*5;
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(h[0],h[1]); ctx.lineTo(h[0],h[1]+dl); ctx.stroke();
  ctx.fillStyle='#6a3b63'; ctx.beginPath(); ctx.arc(h[0],h[1]+dl+3.6,3.6,0,7); ctx.fill();
  ctx.strokeStyle='#6a3b63'; ctx.lineWidth=0.9; for(const k of[-1,1]){ ctx.beginPath(); ctx.moveTo(h[0]+k*3,h[1]+dl+3); ctx.lineTo(h[0]+k*6.5,h[1]+dl+1); ctx.moveTo(h[0]+k*3,h[1]+dl+4.5); ctx.lineTo(h[0]+k*6.5,h[1]+dl+7); ctx.stroke(); }
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(h[0]-1.2,h[1]+dl+3,0.8,0,7); ctx.arc(h[0]+1.2,h[1]+dl+3,0.8,0,7); ctx.fill();
  ctx.restore();
}

  ctx.fillStyle='#6a3b63'; ctx.strokeStyle='#1a1024'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.ellipse(-4,0,5.5,4.6,0,0,7); ctx.fill(); ctx.stroke();

  ctx.fillStyle='rgba(255,120,170,0.7)'; ctx.beginPath(); ctx.arc(-5,-1.6,0.9,0,7); ctx.fill(); ctx.restore(); }
function orbWeb(R,tear,t,NS){ // toile ronde vue de face ; tear = 0..3 sections arrachées

  const gone=i=>{ const sec=Math.floor(i/NS*3); return sec<tear; };
  ctx.fillStyle='rgba(225,205,255,0.16)'; ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=1.8;

      ctx.moveTo(Math.cos(a)*rx*r,Math.sin(a)*ry*r); ctx.quadraticCurveTo(Math.cos(am)*rx*r*sag,Math.sin(am)*ry*r*sag,Math.cos(a2)*rx*r,Math.sin(a2)*ry*r); } ctx.stroke(); }
  // brins arrachés qui pendouillent
  for(let i=0;i<NS;i++){ if(!gone(i)) continue; if(i%2) continue; const a=i/NS*Math.PI*2-Math.PI/2; ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(Math.cos(a)*rx,Math.sin(a)*ry); ctx.quadraticCurveTo(Math.cos(a)*rx*0.8,Math.sin(a)*ry*0.8+10,Math.cos(a)*rx*0.7+Math.sin(t*3+i)*3,Math.sin(a)*ry*0.7+18); ctx.stroke(); }
  for(let i=0;i<12;i++){ const a=i*0.83+0.3, r=rings[1+i%6], ii=Math.floor(((a/(Math.PI*2))%1)*NS); if(gone(ii)) continue; const px=Math.cos(a)*rx*r, py=Math.sin(a)*ry*r;
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.35+0.3*Math.sin(t*3+i*1.7); ctx.drawImage(GLOW,px-6,py-6,12,12); ctx.restore(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px,py,1.6,0,7); ctx.fill(); }
}

function drawSticky(b,w){

  const t=game.time, sy=surf(b,w.x), h=w.h, cx=w.x, cy=sy-h*0.5, rx=34, ry=h*0.56;

  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(cx+w.shake*Math.sin(t*55)*3,cy); ctx.scale(grow,grow); ctx.lineCap='round'; ctx.lineJoin='round';

  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=alpha*(0.22+0.08*Math.sin(t*3+w.ph)); ctx.drawImage(GLOW,-62,-62,124,124); ctx.restore();

  ctx.beginPath(); ctx.moveTo(-10,-ry+2); ctx.lineTo(-34,-ry-26); ctx.moveTo(12,-ry+2); ctx.lineTo(38,-ry-24);
  ctx.moveTo(-16,ry-2); ctx.lineTo(-24,ry+2); ctx.moveTo(16,ry-2); ctx.lineTo(24,ry+2); ctx.stroke();
  // voile
  ctx.fillStyle='rgba(200,160,255,0.13)'; ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,7); ctx.fill();
  const NS=9;
  ctx.strokeStyle='rgba(255,255,255,0.92)'; ctx.lineWidth=1.5;
  for(let i=0;i<NS;i++){ const a=i/NS*Math.PI*2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*rx,Math.sin(a)*ry); ctx.stroke(); }

      else { const am=a-Math.PI/NS, sag=0.86+0.03*Math.sin(t*2+i+rr2*5); ctx.quadraticCurveTo(Math.cos(am)*rx*rr2*sag,Math.sin(am)*ry*rr2*sag,px,py); }
    }

    ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.arc(px,py,1.5,0,7); ctx.fill();

  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-10,-ry+2); ctx.lineTo(-10+sw*0.3,sp); ctx.stroke();
  ctx.fillStyle='#6a3b63'; ctx.beginPath(); ctx.arc(-10+sw*0.3,sp+3.5,3.6,0,7); ctx.fill();
  ctx.strokeStyle='#6a3b63'; ctx.lineWidth=0.9; for(const k of[-1,1]){ ctx.beginPath(); ctx.moveTo(-10+sw*0.3+k*3,sp+3); ctx.lineTo(-10+sw*0.3+k*6.5,sp+1); ctx.moveTo(-10+sw*0.3+k*3,sp+4.5); ctx.lineTo(-10+sw*0.3+k*6.5,sp+7); ctx.stroke(); }
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-11.2+sw*0.3,sp+3,0.8,0,7); ctx.arc(-8.8+sw*0.3,sp+3,0.8,0,7); ctx.fill();

}

const FACES=(()=>{
  const V=[{tilt:-0.12,fw:1,hair:1},{tilt:0.1,fw:0.9,hair:-1},{tilt:-0.05,fw:1.08,hair:1},{tilt:0.16,fw:0.85,hair:-1}];

    const c=document.createElement('canvas'); c.width=180; c.height=260; const g=c.getContext('2d');
    g.translate(90,100); g.rotate(v.tilt);
    // voile / capuche

    g.fillStyle=hg; g.beginPath(); g.moveTo(-44*v.fw,-6); g.bezierCurveTo(-52*v.fw,-78,52*v.fw,-78,44*v.fw,-6);
    g.bezierCurveTo(58,50,66,110,52,158); for(let i=0;i<6;i++) g.quadraticCurveTo(40-i*18,140+(i%2)*26,30-i*18,158); g.bezierCurveTo(-66,110,-58,50,-44*v.fw,-6); g.fill();

    const fg=g.createRadialGradient(-4,-8,4,0,4,46); fg.addColorStop(0,'#e6ebf2'); fg.addColorStop(0.55,'#aab3c8'); fg.addColorStop(1,'#56607e');
    g.fillStyle=fg; g.beginPath(); g.ellipse(0,4,27*v.fw,38,0,0,7); g.fill();
    // ombre du voile sur le front
    const sg=g.createLinearGradient(0,-36,0,0); sg.addColorStop(0,'rgba(30,26,52,0.85)'); sg.addColorStop(1,'rgba(30,26,52,0)'); g.fillStyle=sg; g.beginPath(); g.ellipse(0,4,28*v.fw,39,0,0,7); g.fill();
    // orbites
    g.fillStyle='rgba(60,56,90,0.55)'; for(const sd of[-1,1]){ g.beginPath(); g.ellipse(sd*10*v.fw,-1,8,5.5,0,0,7); g.fill(); }
    if(mode==='closed'){ g.strokeStyle='#2a2440'; g.lineWidth=2; g.lineCap='round'; for(const sd of[-1,1]){ g.beginPath(); g.arc(sd*10*v.fw,-3,6,0.25*Math.PI,0.75*Math.PI); g.stroke(); } }

        const gl=g.createRadialGradient(sd*10*v.fw,-1,0,sd*10*v.fw,-1,9); gl.addColorStop(0,'rgba(255,240,190,0.95)'); gl.addColorStop(0.35,'rgba(255,220,140,0.5)'); gl.addColorStop(1,'rgba(255,220,140,0)');
        g.fillStyle=gl; g.beginPath(); g.arc(sd*10*v.fw,-1,9,0,7); g.fill(); } }

    g.strokeStyle='rgba(60,60,90,0.5)'; g.lineWidth=1.3; g.beginPath(); g.moveTo(-1,4); g.quadraticCurveTo(-3,13,1,15); g.stroke();

  if(REVEAL){ revealTap(); return; }
  if(ALBUM.open){ albumTap(px,py); return; }
  if(state==='title'){
    if(px!=null&&LANT_HIT&&Math.hypot(px-LANT_HIT.x,py-LANT_HIT.y)<LANT_HIT.r){ AU.woke=true; openAlbum(); return; }
    if(px!=null&&!onTitleBtn(px,py)&&fpsTap(px,py)) return;
    if(px!=null&&!onTitleBtn(px,py)){ if(!AU.woke){ AU.woke=true; game.musicT=1.6; } for(const m of members) m.hop=0; return; }
    AU.woke=true; startGame(); return; }
  if(state==='play'){ pilotPress(); return; }
  if(state==='pause'){ resumeGame(); return; }
  if(state==='over'&&overT>0.8){ resetGame(); startGame(); }
}
const pointers=new Set();
cvs.addEventListener('pointerdown',e=>{
  e.preventDefault(); audioInit();
  if(REVEAL||ALBUM.open){ press(e.clientX,e.clientY); return; }
  if(iosTip){ const L=iosTipBtn(); if(IN_FRAME&&Math.abs(e.clientX-L.bx)<L.bw/2+8&&Math.abs(e.clientY-L.by)<L.bh/2+8){ try{ window.open(PAGES_URL,'_blank'); }catch(err){} } iosTip=false; return; }
  if(pauseBtnVisible()){ const fr=fsRect(); if(Math.hypot(e.clientX-fr.x,e.clientY-fr.y)<fr.r+12){ pauseGame(); return; } }
  if(game.updAvail&&(state==='title'||state==='pause')){ const R=updPillRect(); if(Math.abs(e.clientX-R.x)<R.w/2+6&&Math.abs(e.clientY-R.y)<R.h/2+6){ doUpdate(); return; } }
  if(state==='pause'&&game.resumeT>0) return;
  if((state==='title'||state==='pause')&&fsVisible()){ const fr=fsRect(); if(Math.hypot(e.clientX-fr.x,e.clientY-fr.y)<fr.r+8){ toggleFS(); return; } }
  const mr=muteRect();
  if(Math.hypot(e.clientX-mr.x,e.clientY-mr.y)<mr.r+10){ if(state==='title'&&!AU.woke&&!AU.muted){ AU.woke=true; game.musicT=1.6; return; } toggleMute(); return; }
  pointers.add(e.pointerId); press(e.clientX,e.clientY);
},{passive:false});
const up=e=>{ if(pointers.delete(e.pointerId)&&pointers.size===0) release(); };
window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
cvs.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
cvs.addEventListener('contextmenu',e=>e.preventDefault());
['touchend','pointerup','click','keydown'].forEach(ev=>window.addEventListener(ev,()=>{ if(AU.ac) audioWake(); else if(ev!=='keydown') audioInit(); },{passive:true}));
const JUMP_KEYS=new Set(['Space','ArrowUp','KeyW','KeyZ','Enter']);
window.addEventListener('keydown',e=>{
  if(JUMP_KEYS.has(e.code)){ e.preventDefault(); if(e.repeat) return; audioInit(); press(); }
  else if(e.code==='KeyM'){ audioInit(); toggleMute(); }
  else if(e.code==='KeyF'&&e.shiftKey){ PERF.show=!PERF.show; }
  else if(e.code==='KeyP'||e.code==='Escape'){ if(ALBUM.open&&!REVEAL){ closeAlbum(); return; } if(state==='play') pauseGame(); else if(state==='pause') resumeGame(); }
});
window.addEventListener('keyup',e=>{ if(JUMP_KEYS.has(e.code)) release(); });
window.addEventListener('blur',()=>{ pointers.clear(); release(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play') pauseGame(); if(document.hidden&&state==='pause') game.resumeT=0; if(!document.hidden){ if(AU.ac) audioWake(); checkUpdate(); } });
window.addEventListener('pageshow',()=>{ if(AU.ac) audioWake(); });

/* =========================================================
   REDIMENSIONNEMENT & BOUCLE
   ========================================================= */
let layerTimer=0;
function resize(first){
  W=window.innerWidth; H=window.innerHeight; DPR_BASE=Math.min(2,window.devicePixelRatio||1); DPR=qualityDPR();
  cvs.width=Math.round(W*DPR); cvs.height=Math.round(H*DPR);
  S=Math.min(H/WORLD_H,W/640); VW=W/S; VH=H/S; OY=(VH-WORLD_H)/2;
  LEAD=VW<800?0.34:0.4;
  const cs=getComputedStyle(safeEl);
  SAFE.t=parseFloat(cs.paddingTop)||0; SAFE.r=parseFloat(cs.paddingRight)||0; SAFE.b=parseFloat(cs.paddingBottom)||0; SAFE.l=parseFloat(cs.paddingLeft)||0;
  buildHalftone(); buildLeaves();
  if(first) buildLayers(); else { clearTimeout(layerTimer); layerTimer=setTimeout(buildLayers,120); }
}
window.addEventListener('resize',()=>resize(false));
window.addEventListener('orientationchange',()=>{ setTimeout(()=>resize(false),200); setTimeout(()=>resize(false),600); });
try{ if(window.visualViewport) visualViewport.addEventListener('resize',()=>{ if(Math.abs(window.innerHeight-H)>1||Math.abs(window.innerWidth-W)>1) resize(false); }); }catch(e){}
document.addEventListener('fullscreenchange',()=>setTimeout(()=>resize(false),60)); document.addEventListener('webkitfullscreenchange',()=>setTimeout(()=>resize(false),60));
window.addEventListener('pageshow',()=>resize(false));

let lastT=performance.now();
const RAFI=[]; let rafHalf=false, rafOdd=false, rafPrev=0, rafMed=16.7;
/* ---------- Résolution adaptative ---------- */
const QS=[1,0.8,0.65]; let qLvl=0, qLock=false;
const PERF={acc:0,n:0,t:0,pending:null,good:0,lastRaise:-1e9,fps:60,ms:0,show:false,taps:0,tapT:0};
try{ PERF.show=localStorage.getItem('ilimba.fps')==='1'; }catch(e){}
function qualityDPR(){ return Math.max(0.75,DPR_BASE*QS[qLvl]); }
function setQuality(l){ l=clamp(l,0,QS.length-1); if(l===qLvl) return; qLvl=l; DPR=qualityDPR(); cvs.width=Math.round(W*DPR); cvs.height=Math.round(H*DPR); }
function perfTick(dtMs){
  PERF.fps+=((dtMs>0?1000/dtMs:60)-PERF.fps)*0.08;
  if(window.__noAdapt) return;
  if(state==='pause'||document.hidden||RAFI.length<90||!(dtMs>0)||dtMs>250){ PERF.acc=0; PERF.n=0; PERF.t=0; return; }
  PERF.acc+=dtMs; PERF.n++; PERF.t+=dtMs; if(PERF.t<2000) return;
  const avg=PERF.acc/PERF.n, target=1000/60; PERF.acc=0; PERF.n=0; PERF.t=0;
  if(PERF.pending){ const P=PERF.pending; PERF.pending=null;
    if(avg>P.before*0.9){ setQuality(P.from); qLock=true; } // pas de gain : appareil bridé (mode économie…), on revient et on fige
    return; }
  if(qLock) return;
  if(avg>target*1.18&&qLvl<QS.length-1){ if(performance.now()-PERF.lastRaise<6000) qLock=true; PERF.pending={from:qLvl,before:avg}; setQuality(qLvl+1); PERF.good=0; }
  else if(avg<target*1.06){ if(++PERF.good>=5&&qLvl>0){ setQuality(qLvl-1); PERF.good=0; PERF.lastRaise=performance.now(); } }
  else PERF.good=0;
}
function fpsTap(px,py){ if(!(px>W-80-SAFE.r&&py>H-30-SAFE.b)) return false; const now=performance.now(); PERF.taps=now-PERF.tapT<650?PERF.taps+1:1; PERF.tapT=now;
  if(PERF.taps>=3){ PERF.taps=0; PERF.show=!PERF.show; try{ localStorage.setItem('ilimba.fps',PERF.show?'1':'0'); }catch(e){} } return true; }
function drawFps(){ if(!PERF.show) return; const txt=Math.round(PERF.fps)+' fps · '+PERF.ms.toFixed(1)+' ms · ×'+DPR.toFixed(2)+(qLvl?' (Q'+qLvl+(qLock?'🔒':'')+')':'')+(rafHalf?' · 120Hz→60':'');
  ctx.save(); ctx.setTransform(DPR,0,0,DPR,0,0); ctx.font='700 11px '+FU; const w=ctx.measureText(txt).width+14, x=SAFE.l+10, y=H-SAFE.b-30;
  ctx.fillStyle='rgba(10,8,20,0.6)'; ctx.beginPath(); ctx.roundRect(x,y,w,20,10); ctx.fill(); ctx.fillStyle=PERF.fps>55?'#9ff0b0':PERF.fps>40?'#ffe08a':'#ff9a9a'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(txt,x+7,y+10.5); ctx.restore(); }
function frame(now){
  requestAnimationFrame(frame);
  if(window.__freeze) return;
  if(RAFI.length<90){ if(rafPrev) RAFI.push(now-rafPrev); rafPrev=now; if(RAFI.length===90){ const a=RAFI.slice().sort((x,y)=>x-y); rafMed=a[45]; rafHalf=a[45]<10; } }
  if(rafHalf){ rafOdd=!rafOdd; if(rafOdd) return; }
  const dtMs=now-lastT; let dt=dtMs/1000; lastT=now; try{ perfTick(dtMs); }catch(e){}
  if(!(dt>0)) dt=0; if(dt>0.05) dt=0.05;
  let ts=1;
  if(game.cine){ const C=game.cine; C.rt+=dt; if(C.rt>1.3||state!=='play') game.cine=null; }
  game.dtReal=dt; if(iosTip) iosTipT+=dt; try{ revealStep(); }catch(e){}
  if(state==='pause'&&game.resumeT>0){ game.resumeT-=dt; if(game.resumeT<=0){ game.resumeT=0; state='play'; } }
  const w0=performance.now(); try{ update(dt*ts); render(); drawFps(); }catch(e){ console.error(e); } PERF.ms+=((performance.now()-w0)-PERF.ms)*0.1;
  try{ audioTick(); }catch(e){}
}
resize(true);
initCritters();
resetGame();
requestAnimationFrame(frame);

window.__drawIcon=function(sz,rf){ window.__freeze=true; ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createLinearGradient(0,0,0,sz); g.addColorStop(0,'#ffd6ea'); g.addColorStop(0.55,'#e9d4ff'); g.addColorStop(1,'#cfe9ff'); ctx.fillStyle=g; ctx.fillRect(0,0,sz,sz);
  ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(sz*0.72,sz*0.28,sz*0.16,0,7); ctx.fill();
  ctx.fillStyle='#b9e3a8'; ctx.beginPath(); ctx.moveTo(0,sz*0.78); ctx.bezierCurveTo(sz*0.3,sz*0.68,sz*0.7,sz*0.7,sz,sz*0.76); ctx.lineTo(sz,sz); ctx.lineTo(0,sz); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#8fcf7a'; ctx.beginPath(); ctx.moveTo(0,sz*0.86); ctx.bezierCurveTo(sz*0.35,sz*0.8,sz*0.65,sz*0.84,sz,sz*0.82); ctx.lineTo(sz,sz); ctx.lineTo(0,sz); ctx.closePath(); ctx.fill();
  try{ sakura(sz*0.2,sz*0.24,sz*0.05,'#ffb3d1',0.3); sakura(sz*0.84,sz*0.56,sz*0.035,'#d7c2ff',-0.4); }catch(e){}
  const m=newMember(); m.pal=PALS[1]||PALS[0]; m.acc=null; const t0=game.time; game.time=0.2;
  drawKawaii(m,sz*0.5,sz*(rf?0.76:0.8),{r:sz*(rf||0.3)}); game.time=t0;
  return true; };
window.__fs={KINDS,SAVE,ALBUM,openAlbum,get REVEAL(){return REVEAL;},get LANT(){return LANT_HIT;},saveColl,cam:()=>[camX,S,OY],perf:PERF,get q(){return [qLvl,qLock,DPR];},setQuality,fsVisible,fsRect,isFS,checkUpdate,pauseBtnVisible,render:()=>render(),get iosTip(){return iosTip;}};
window.__mousselins={cheer,zoneAt,diff,speedAt,genNext,get lucioles(){return lucioles;},get critters(){return critters;},get AU(){return AU;},get lanterns(){return lanterns;},get state(){return state;},game,pilot,get members(){return members;},get branches(){return branches;},get crows(){return crows;},branchAt,surf,press,release,brume};
})();
